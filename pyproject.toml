[project]
name = "commission"
version = "0.2.0"
description = "房产中介佣金计算工具"
readme = "README.md"
authors = [
    { name = "chavez-2023", email = "apchat2023@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.6",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0",
]

[project.scripts]
commission = "commission.cli:main"
commission-gui = "commission.gui.app:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
