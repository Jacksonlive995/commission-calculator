[project]
name = "commission"
version = "0.1.0"
description = "房产中介佣金计算工具"
readme = "README.md"
authors = [
    { name = "chavez-2023", email = "apchat2023@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["pyside6>=6.6"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
commission = "commission.cli:main"
commission-gui = "commission.gui.app:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
