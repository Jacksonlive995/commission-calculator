name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --frozen pytest -q tests

      - name: Build Python distributions
        run: uv build --no-sources

      - name: Build Windows executable
        run: uv run --frozen pyinstaller --noconfirm --clean "佣金计算器.spec"

      - name: Prepare download
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows-package | Out-Null
          Copy-Item "dist/佣金计算器.exe", ".env.example" -Destination dist/windows-package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: commission-calculator-windows-x64
          path: dist/windows-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
